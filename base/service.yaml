  name: deco-exporter
  namespace: deco-exporter
  labels:
    app: deco-exporter
    app.kubernetes.io/name: deco-exporter
spec:
  selector:
    app: deco-exporter
  ports:
  - name: metrics
    port: 9850
    targetPort: metrics
    protocol: TCP
  type: ClusterIP
