# The Deco local admin password (homelab#1931), stored in Infisical as
# DECO_PASSWORD in project homelab-bz-gt, env prod, path /.
#
# InfisicalSecret, never a literal Secret in git. includeAllSecrets: false
# plus a one-key template means the materialised Secret holds ONLY this
# password, not every value at path / (which includes Harbor and CI creds).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: deco-exporter-password
  namespace: deco-exporter
  labels:
    app.kubernetes.io/name: deco-exporter
    app.kubernetes.io/part-of: homelab-app
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
      secretsScope:
        envSlug: prod
        projectSlug: homelab-bz-gt
        recursive: false
        secretsPath: /
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  managedSecretReference:
    creationPolicy: Owner
    secretName: deco-exporter-password
    secretNamespace: deco-exporter
    secretType: Opaque
    template:
      data:
        DECO_PASSWORD: '{{ .DECO_PASSWORD.Value }}'
      includeAllSecrets: false
  resyncInterval: 60
